<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e3a8a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#ea580c"/>
    </linearGradient>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>

  <!-- Decorative circle -->
  <circle cx="256" cy="210" r="90" fill="none" stroke="#1e40af" stroke-width="3" opacity="0.4"/>
  <circle cx="256" cy="210" r="70" fill="#1e40af" opacity="0.3"/>

  <!-- Wrench symbol (simplified, clean) -->
  <g transform="translate(256,210)" fill="white">
    <!-- Wrench body -->
    <path d="M-12,40 L-6,-15 C-6,-20 -16,-35 -28,-42 C-22,-52 -10,-56 0,-56 C10,-56 22,-52 28,-42 C16,-35 6,-20 6,-15 L12,40 C12,46 8,50 0,50 C-8,50 -12,46 -12,40Z" opacity="0.95"/>
    <!-- Wrench head notch -->
    <rect x="-4" y="-56" width="8" height="16" rx="2" fill="#0f172a" opacity="0.6"/>
    <!-- Center bolt -->
    <circle cx="0" cy="8" r="6" fill="#0f172a" opacity="0.4"/>
  </g>

  <!-- "G" main letter -->
  <text x="256" y="375" font-family="Arial,Helvetica,sans-serif" font-size="110" font-weight="900" fill="white" text-anchor="middle" letter-spacing="-2">G</text>

  <!-- Orange accent bar -->
  <rect x="186" y="395" width="140" height="5" rx="2.5" fill="url(#accent)"/>

  <!-- "TALLER" subtitle -->
  <text x="256" y="435" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="700" fill="#93c5fd" text-anchor="middle" letter-spacing="10">TALLER</text>

  <!-- Bottom accent dots -->
  <circle cx="226" cy="465" r="3" fill="#f97316" opacity="0.6"/>
  <circle cx="256" cy="465" r="3" fill="#f97316" opacity="0.8"/>
  <circle cx="286" cy="465" r="3" fill="#f97316" opacity="0.6"/>
</svg>
